name: Architecture boundaries

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: windows-latest
    env:
      OSU_BINARY_ARCHIVE_URL: ${{ vars.OSU_BINARY_ARCHIVE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Source boundaries
        shell: pwsh
        run: |
          ./scripts/check-module-boundary.ps1
          ./scripts/check-storage-boundary.ps1
          ./scripts/check-scoring-boundary.ps1
      - name: Portable modules and semantic checker
        shell: pwsh
        run: |
          dotnet test O2Jam.Core.Tests/O2Jam.Core.Tests.csproj -c Release --filter 'FullyQualifiedName~.Normal.Core.'
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
          dotnet test O2Jam.Formats.Tests/O2Jam.Formats.Tests.csproj -c Release --filter 'FullyQualifiedName~.Normal.'
          if ($LASTEXITCODE -ne 0) { throw 'Format tests failed.' }
          dotnet test scripts/Architecture.Tests/Architecture.Tests.csproj -c Release --filter 'FullyQualifiedName~.Normal.'
          if ($LASTEXITCODE -ne 0) { throw 'Architecture tests failed.' }
      - name: Host reference coverage
        if: env.OSU_BINARY_ARCHIVE_URL == ''
        shell: pwsh
        run: |
          'Portable checks ran. Full host dependency analysis requires OSU_BINARY_ARCHIVE_URL with binaries matching Directory.Build.props; it has not run in this job.' >> $env:GITHUB_STEP_SUMMARY
      - name: Full host dependency graph
        if: env.OSU_BINARY_ARCHIVE_URL != ''
        shell: pwsh
        run: |
          New-Item -Path .artifacts -ItemType Directory -Force | Out-Null
          Invoke-WebRequest -Uri $env:OSU_BINARY_ARCHIVE_URL -OutFile .artifacts/host-binaries.zip
          Expand-Archive -LiteralPath .artifacts/host-binaries.zip -DestinationPath .artifacts/host-binaries
          $candidates = @(Get-ChildItem .artifacts/host-binaries -Recurse -Filter osu.Game.dll | Where-Object {
            Test-Path -LiteralPath (Join-Path $_.DirectoryName 'osu.Game.Rulesets.Mania.dll')
          })
          if ($candidates.Count -ne 1) { throw 'The archive must contain one matching Game/Mania binary directory.' }
          ./scripts/check-architecture.ps1 -OsuBinaryDirectory $candidates[0].DirectoryName
