name: Architecture boundaries

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: windows-latest
    env:
      OSU_BINARY_ARCHIVE_URL: ${{ vars.OSU_BINARY_ARCHIVE_URL }}
      OSU_BINARY_ARCHIVE_SHA256: ${{ vars.OSU_BINARY_ARCHIVE_SHA256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Portable modules and source boundaries
        shell: pwsh
        run: ./scripts/verify.ps1 -Scope Portable
      - name: Host reference coverage
        if: always() && env.OSU_BINARY_ARCHIVE_URL == ''
        shell: pwsh
        run: |
          'Host dependency analysis, regular host tests, Realm migration/recovery and replay import tests have NOT run: OSU_BINARY_ARCHIVE_URL is missing. Supply trusted binaries matching Directory.Build.props, including Game, Mania and Resources in one directory.' >> $env:GITHUB_STEP_SUMMARY
      - name: Host dependencies and isolated regressions
        if: env.OSU_BINARY_ARCHIVE_URL != ''
        shell: pwsh
        run: |
          if ($env:OSU_BINARY_ARCHIVE_SHA256 -notmatch '^[a-fA-F0-9]{64}$') {
            throw 'Host verification requires the trusted archive SHA-256 in OSU_BINARY_ARCHIVE_SHA256.'
          }
          New-Item -Path .artifacts -ItemType Directory -Force | Out-Null
          Invoke-WebRequest -Uri $env:OSU_BINARY_ARCHIVE_URL -OutFile .artifacts/host-binaries.zip
          if ((Get-FileHash -LiteralPath .artifacts/host-binaries.zip -Algorithm SHA256).Hash -ne $env:OSU_BINARY_ARCHIVE_SHA256) {
            throw 'Host reference archive SHA-256 does not match the pinned digest.'
          }
          Expand-Archive -LiteralPath .artifacts/host-binaries.zip -DestinationPath .artifacts/host-binaries
          $candidates = @(Get-ChildItem .artifacts/host-binaries -Recurse -Filter osu.Game.dll | Where-Object {
            (Test-Path -LiteralPath (Join-Path $_.DirectoryName 'osu.Game.Rulesets.Mania.dll')) -and
            (Test-Path -LiteralPath (Join-Path $_.DirectoryName 'osu.Game.Resources.dll'))
          })
          if ($candidates.Count -ne 1) { throw 'The archive must contain one matching Game/Mania/Resources binary directory.' }
          ./scripts/verify.ps1 -Scope Host -OsuBinaryDirectory $candidates[0].DirectoryName
      - name: Verification results
        if: always()
        shell: pwsh
        run: |
          '| Report | Total | Passed | Failed | Not executed |' >> $env:GITHUB_STEP_SUMMARY
          '|---|---:|---:|---:|---:|' >> $env:GITHUB_STEP_SUMMARY
          foreach ($path in Get-ChildItem .artifacts/test-results -Filter '*.trx' -ErrorAction SilentlyContinue) {
            [xml]$document = Get-Content -LiteralPath $path.FullName -Raw
            $ns = [System.Xml.XmlNamespaceManager]::new($document.NameTable)
            $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
            $counts = $document.SelectSingleNode('//t:ResultSummary/t:Counters', $ns)
            "| $($path.Name) | $($counts.total) | $($counts.passed) | $($counts.failed) | $($counts.notExecuted) |" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            .artifacts/test-results/*.trx
            .artifacts/architecture/dependencies.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
